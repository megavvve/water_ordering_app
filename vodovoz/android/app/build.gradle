plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.vodovoz"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.example.vodovoz"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

      packaging {
        resources {
            // Указывает, что нужно использовать первый найденный экземпляр конфликта.
            pickFirsts.add("META-INF/AL2.0")
            pickFirsts.add("META-INF/LGPL2.1")
               pickFirsts.add("xsd/catalog.xml")
                pickFirsts.add("META-INF/DEPENDENCIES")
        }
    }
}

flutter {
    source '../..'
}

configurations {
    all {
        exclude group: 'com.sun.activation', module: 'javax.activation'
    }
}

dependencies {
    implementation 'com.yandex.android:maps.mobile:4.6.1-full'
     implementation 'androidx.appcompat:appcompat:1.7.0'
    // implementation 'com.android.tools.build:gradle:8.10.2'
    // implementation 'jakarta.activation:jakarta.activation-api:2.1.3'

    // // Добавляем core library desugaring
     coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}
